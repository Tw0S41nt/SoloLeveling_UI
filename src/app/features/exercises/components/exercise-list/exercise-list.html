<section class="exercise-list">
  <h2>Exercise Library</h2>

  <app-body-part-filter />

  <div class="add-exercise">
    <input
      type="text"
      placeholder="New exercise name"
      aria-label="New exercise name"
      [value]="newExerciseName()"
      (input)="onNameInput($event)"
      (keydown.enter)="addExercise()"
    />
    <button type="button" [disabled]="!newExerciseName().trim()" (click)="addExercise()">
      Add Item
    </button>
  </div>

  @if (exercises().length > 0) {
    <p class="count">{{ exercises().length }} exercises available</p>
  }

  <div class="grid">
    @for (exercise of exercises(); track exercise.exerciseId) {
      <app-exercise-detail-card [exercise]="exercise" />
    } @empty {
      <p class="empty">No exercises yet. Add one above.</p>
    }
  </div>
</section>
